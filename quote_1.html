<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><style>html{color-scheme:light dark}img{max-width:100%}</style><title>CDCS Quote Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Azeret+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#2B282A; --ink-raised:#3E393A; --paper:#ECEBEA; --accent:#EDA220; --accent-ink:#7A5208;
  --page-bg:#DCD8D2; --page-fg:#2B282A; --page-muted:#6E6663; --page-rule:#C4BFB8; --surface:#E7E3DD;
  --warn:#8A4B12;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page-bg:#1A1819; --page-fg:#ECEBEA; --page-muted:#8E8683; --page-rule:#332F30; --surface:#232021;
  --accent-ink:#EDA220; --warn:#E0A063;
}}
:root[data-theme="dark"]{
  --page-bg:#1A1819; --page-fg:#ECEBEA; --page-muted:#8E8683; --page-rule:#332F30; --surface:#232021;
  --accent-ink:#EDA220; --warn:#E0A063;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page-bg);color:var(--page-fg);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
  padding:0 1rem calc(6.5rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:30rem}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.1rem 0 .9rem}
header img{width:7rem;height:auto;display:block;border-radius:6px}
.step-count{font-family:"Azeret Mono",monospace;font-size:.58rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--page-muted);white-space:nowrap;margin:0}
.bar{height:3px;background:var(--page-rule);border-radius:99px;overflow:hidden;margin-bottom:1.6rem}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}

.eyebrow{font-family:"Azeret Mono",monospace;font-size:.58rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent-ink);margin:0 0 .6rem;font-weight:600}
h1{margin:0 0 .5rem;font-size:1.45rem;line-height:1.2;letter-spacing:-.02em;text-wrap:balance;font-weight:700}
.help{margin:0 0 1.4rem;font-size:.9rem;line-height:1.5;color:var(--page-muted);max-width:36ch}

.opts{display:flex;flex-direction:column;gap:.55rem;margin-bottom:1rem}
.opt{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;
  background:var(--surface);color:var(--page-fg);border:1px solid var(--page-rule);
  border-radius:10px;padding:.95rem 1rem;min-height:56px;font:inherit;font-weight:600;
  font-size:.95rem;cursor:pointer;transition:border-color .12s,background .12s,transform .1s}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:translateY(1px)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#231F20}
.opt .tag{margin-left:auto;font-family:"Azeret Mono",monospace;font-size:.62rem;
  letter-spacing:.08em;opacity:.75;font-weight:500;white-space:nowrap}
.opt small{display:block;font-weight:400;font-size:.78rem;opacity:.75;margin-top:.2rem;line-height:1.35}
.opt:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid var(--accent);outline-offset:3px}

label.f{display:block;margin-bottom:1rem}
label.f > span{display:block;font-family:"Azeret Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--page-muted);margin-bottom:.4rem}
input,textarea{width:100%;font:inherit;font-size:1rem;padding:.8rem .9rem;min-height:52px;
  background:var(--surface);color:var(--page-fg);border:1px solid var(--page-rule);border-radius:10px}
textarea{min-height:4.5rem;resize:vertical}
.hint{font-size:.78rem;color:var(--page-muted);margin:.35rem 0 0;line-height:1.45}

/* task groups */
.grp{border:1px solid var(--page-rule);border-radius:10px;background:var(--surface);margin-bottom:.55rem;overflow:hidden}
.grp summary{cursor:pointer;list-style:none;padding:.9rem 1rem;min-height:54px;display:flex;
  align-items:center;gap:.7rem;font-weight:700;font-size:.92rem}
.grp summary::-webkit-details-marker{display:none}
.grp summary::after{content:"+";margin-left:auto;font-family:"Azeret Mono",monospace;
  font-size:1.1rem;color:var(--page-muted);font-weight:400}
.grp[open] summary::after{content:"–"}
.count{font-family:"Azeret Mono",monospace;font-size:.6rem;letter-spacing:.08em;
  background:var(--accent);color:#231F20;border-radius:99px;padding:.2rem .45rem;font-weight:600}
.grp .items{padding:0 1rem 1rem;display:flex;flex-direction:column;gap:.15rem}
.chk{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem 0;cursor:pointer;
  font-size:.88rem;line-height:1.45;border-top:1px solid var(--page-rule)}
.chk input{width:22px;height:22px;min-height:0;flex:none;margin:.1rem 0 0;accent-color:var(--accent);padding:0}
.allbtn{background:none;border:0;font:inherit;font-family:"Azeret Mono",monospace;font-size:.6rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);cursor:pointer;
  padding:.5rem 0 0;font-weight:600;text-decoration:underline}

.nav{display:flex;gap:.6rem;margin-top:1.3rem}
.btn{flex:1;min-height:52px;padding:.85rem 1rem;border-radius:10px;font:inherit;font-weight:700;
  font-size:.95rem;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s}
.btn-primary{background:var(--accent);color:#231F20}
.btn-primary:hover{background:#F5B23C}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{flex:0 0 auto;min-width:5.5rem;background:transparent;color:var(--page-fg);border-color:var(--page-rule)}
.btn-ghost:hover{border-color:var(--page-muted)}
a.btn{text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}

.total{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);
  border-top:3px solid var(--accent);padding:.85rem 1rem calc(.85rem + env(safe-area-inset-bottom));z-index:20}
.total-in{max-width:30rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.total-l{font-family:"Azeret Mono",monospace;font-size:.58rem;letter-spacing:.14em;
  text-transform:uppercase;color:#9A908C;margin:0 0 .2rem}
.total-d{font-size:.78rem;color:#C3B9B4;margin:0;line-height:1.35}
.total-v{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta{display:inline-block;font-family:"Azeret Mono",monospace;font-size:.6rem;font-weight:600;
  color:var(--accent);margin-left:.4rem;opacity:0;transform:translateY(3px);transition:opacity .25s,transform .25s}
.delta.show{opacity:1;transform:translateY(0)}

.lines{margin:0 0 1.1rem;border-top:1px solid var(--page-rule)}
.line{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;
  padding:.7rem 0;border-bottom:1px solid var(--page-rule)}
.line dt{margin:0;font-size:.9rem;font-weight:500}
.line dd{margin:0;font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.line small{display:block;font-size:.74rem;color:var(--page-muted);font-weight:400;margin-top:.15rem}
.line.sum dt,.line.sum dd{font-size:1.2rem;font-weight:800}
.line.sum{border-bottom:0;border-top:2px solid var(--page-fg);padding-top:.9rem}
.line.sub dt,.line.sub dd{font-size:.85rem;color:var(--page-muted);font-weight:500}
.line.net dt,.line.net dd{font-weight:800;font-size:1rem}
.note{background:var(--surface);border:1px solid var(--page-rule);border-left:3px solid var(--accent);
  border-radius:8px;padding:.85rem 1rem;margin:0 0 1rem}
.note p{margin:0;font-size:.85rem;line-height:1.55}
.note p + p{margin-top:.5rem}
.stop{border-left-color:var(--warn)}
.terms{list-style:none;padding:0;margin:0}
.terms li{font-size:.85rem;line-height:1.5;padding:.4rem 0 .4rem 1.1rem;position:relative;color:var(--page-muted)}
.terms li::before{content:"";position:absolute;left:0;top:.85em;width:5px;height:5px;border-radius:99px;background:var(--accent)}
h2{font-family:"Azeret Mono",monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--page-muted);font-weight:600;margin:1.6rem 0 .5rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <div><p class="total-l">Running total</p><p class="total-d" id="totalDesc">&mdash;</p></div>
    <div class="total-v" id="totalVal">&mdash;<span class="delta" id="delta"></span></div>
  </div>
</div>

<script>
/* ============================================================
   PRICING RULES — change these numbers, nothing else.
   ============================================================ */
const RULES = {
  currency: "£",
  dayRate:       { zone1: 135, zone2: 150 },
  overtimeMult:  1.5,
  standardHours: 8,
  saturdayAM:    115,
  saturdayFull:  200,
  cisRate:       0.20,          // deducted by the contractor, labour only
  mileageRate:   0.55,          // HMRC approved rate, first 10,000 miles
  zones: {
    zone1: { maxReturnMiles: 40, label: "Greater Manchester" },
    zone2: { maxReturnMiles: 60, label: "Wigan / Warrington / edges" }
  },
  hours: { weekday: "08:00–16:30, 30 min unpaid lunch", saturday: "08:00–12:30" },
  whatsapp: "447356003438"
};
const hourly = () => RULES.dayRate.zone1 / RULES.standardHours;
const otRate = () => Math.round(hourly() * RULES.overtimeMult);

/* Approximate return miles from Stockport. PROTOTYPE — swap for a real distance lookup. */
const AREA = { SK:16, M:20, OL:24, BL:34, WA:44, WN:54, CW:56, HD:60, BB:62, CH:60, ST:62, PR:70, L:66, LA:110, DE:70, S:64 };
const OUTWARD = { SK9:16, SK10:24, SK11:32, SK13:24, SK17:42, SK22:20, SK23:28,
  M23:20, M31:26, M33:16, M41:22, M44:28, M46:32, M90:22,
  OL16:30, OL3:26, BL0:38, WA13:24, WA14:16, WA15:14, WA16:30 };

function zoneFor(pc){
  const p=(pc||"").toUpperCase().replace(/\s+/g,""); const m=p.match(/^([A-Z]{1,2}\d{1,2}[A-Z]?)/);
  if(!m) return null;
  const out=m[1], area=out.match(/^[A-Z]+/)[0];
  const miles = OUTWARD[out] ?? AREA[area] ?? null;
  if(miles===null) return null;
  if(miles<=RULES.zones.zone1.maxReturnMiles) return {key:"zone1",miles,...RULES.zones.zone1};
  if(miles<=RULES.zones.zone2.maxReturnMiles) return {key:"zone2",miles,...RULES.zones.zone2};
  return {key:"outside",miles,label:"Outside standard area"};
}

/* ---------- the task list ---------- */
const TASKS = [
  { g:"Material handling & prep", items:[
    "Unloading deliveries of timber, plasterboard and structural components",
    "Moving materials to the work area to keep the site flowing",
    "Measuring timber to the carpenter's instructions",
    "Cutting to rough size with hand saws or basic power tools",
    "Sorting timber by grade, size and quality before installation" ]},
  { g:"Work area & tools", items:[
    "Setting up sawhorses, benches and power extensions",
    "Organising hand tools — chisels, planes, hammers — for easy access",
    "Cleaning power tools and checking cables for safety",
    "Clearing sawdust and offcuts to keep the area safe",
    "Packing equipment away securely at end of shift" ]},
  { g:"Assisting installations", items:[
    "Holding heavy timbers or sheet materials in place during fixing",
    "Applying adhesives and wood glue to joints before assembly",
    "Sanding surfaces ready for paint, varnish or stain",
    "Pre-drilling for screws and structural bolts",
    "Fitting basic ironmongery — handles, hinges, locks" ]},
  { g:"Structural & site work", items:[
    "Erecting basic platforms or working stagings under supervision",
    "Fixing temporary bracing to hold timber frames stable",
    "Stripping out skirting, architrave and door frames",
    "De-nailing and cleaning reclaimed timber for reuse" ]}
];

/* ---------- state ---------- */
const S = { need:null, postcode:"", zone:null, days:null, start:"", weekend:"none",
            otHours:0, tasks:new Set(), notes:"", company:"", name:"", phone:"", email:"" };
let step = 0, lastTotal = 0;
const money = n => RULES.currency + n.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});

/* ---------- the sum ---------- */
function calc(){
  const lines=[];
  if(!S.zone || S.zone.key==="outside") return {lines,total:0,siteDays:0};
  const rate = RULES.dayRate[S.zone.key];
  let siteDays = 0;

  if(S.days>0){
    siteDays += S.days;
    lines.push({label:`${S.days} weekday${S.days>1?"s":""} × ${money(rate)}`,
      sub:`${S.zone.label} · ${RULES.hours.weekday}`, amount:S.days*rate});
  }
  if(S.otHours>0 && S.days>0){
    lines.push({label:`Overtime — ${S.otHours} hr/day × ${S.days} day${S.days>1?"s":""}`,
      sub:`${money(otRate())}/hr, past 8 hours`, amount:S.otHours*S.days*otRate()});
  }
  if(S.weekend==="satam"){ siteDays+=1; lines.push({label:"Saturday morning",sub:RULES.hours.saturday,amount:RULES.saturdayAM}); }
  if(S.weekend==="satfull"){ siteDays+=1; lines.push({label:"Saturday — full day",sub:"Unrestricted sites only",amount:RULES.saturdayFull}); }
  if(S.weekend==="weekend"){ siteDays+=1;
    lines.push({label:"Saturday morning",sub:RULES.hours.saturday,amount:RULES.saturdayAM}); }
  return {lines, total:lines.reduce((a,l)=>a+l.amount,0), siteDays};
}
const sundayFlagged = () => S.weekend==="sun" || S.weekend==="weekend";

/* ---------- running total ---------- */
function paintTotal(){
  const bar=document.getElementById("totalBar"); const {total}=calc();
  const visible = step>=2 && S.zone && S.zone.key!=="outside";
  bar.hidden = !visible; if(!visible){ lastTotal=0; return; }
  document.getElementById("totalVal").childNodes[0].nodeValue = total?money(total):"—";
  const bits=[];
  if(S.days) bits.push(`${S.days} day${S.days>1?"s":""}`);
  if(S.otHours) bits.push(`+${S.otHours} hr OT/day`);
  bits.push(...({none:[],satam:["Sat morning"],satfull:["Sat full day"],
    sun:["Sunday — ask"],weekend:["Sat + Sun — Sun to confirm"]})[S.weekend]);
  if(S.tasks.size) bits.push(`${S.tasks.size} task${S.tasks.size>1?"s":""}`);
  if(S.zone) bits.push(S.zone.label);
  document.getElementById("totalDesc").textContent = bits.length?bits.join(" · "):"Answer the next question";
  const d=document.getElementById("delta"), diff=total-lastTotal;
  if(diff!==0 && lastTotal!==0){ d.textContent=(diff>0?"+":"−")+money(Math.abs(diff));
    d.classList.add("show"); setTimeout(()=>d.classList.remove("show"),2200); }
  lastTotal=total;
}

/* ---------- screens ---------- */
const app = () => document.getElementById("app");
function nav(back,label,off){
  return `<div class="nav">${back?'<button class="btn btn-ghost" data-act="back">Back</button>':''}
  <button class="btn btn-primary" data-act="next" ${off?"disabled":""}>${label}</button></div>`;
}

const SCREENS = [
/* 0 — what do you need */ () => `
  <p class="eyebrow">Step 1 · The role</p>
  <h1>What do you need on site?</h1>
  <p class="help">I work as a carpenter's mate — alongside your carpenter, taking their instructions.</p>
  <div class="opts">
    <button class="opt" data-set="need" data-val="mate" aria-pressed="${S.need==='mate'}">
      <span>Mate for our carpenter<small>Assisting your carpenter on their instructions</small></span></button>
    <button class="opt" data-set="need" data-val="solo" aria-pressed="${S.need==='solo'}">
      <span>Something else<small>Solo carpentry, or general labouring</small></span></button>
  </div>`,

/* 1 — postcode */ () => `
  <p class="eyebrow">Step 2 · Where</p>
  <h1>What's the site postcode?</h1>
  <p class="help">Travel is inside the day rate. The postcode only sets which zone applies.</p>
  <label class="f"><span>Site postcode</span>
    <input id="pc" inputmode="text" autocomplete="postal-code" placeholder="e.g. M1 3BE" value="${S.postcode}"></label>
  <div id="pcOut"></div>`,

/* 2 — days */ () => `
  <p class="eyebrow">Step 3 · How long</p>
  <h1>How many weekdays do you need?</h1>
  <p class="help">Full days, minimum one. ${RULES.hours.weekday}.</p>
  <div class="opts">
    ${[1,2,3,4,5].map(n=>`<button class="opt" data-set="days" data-val="${n}" aria-pressed="${S.days===n}">${n} day${n>1?"s":""}<span class="tag">${money(RULES.dayRate[S.zone?S.zone.key:"zone1"]*n)}</span></button>`).join("")}
  </div>
  <label class="f"><span>Or type a number</span>
    <input id="daysN" type="number" min="1" max="60" inputmode="numeric" placeholder="e.g. 12" value="${S.days&&S.days>5?S.days:""}"></label>
  <label class="f"><span>Start date (optional)</span><input id="start" type="date" value="${S.start}"></label>`,

/* 3 — weekend + OT */ () => `
  <p class="eyebrow">Step 4 · Beyond the standard week</p>
  <h1>Any weekend or overtime?</h1>
  <p class="help">Weekends and hours past 4:30pm run at time-and-a-half. Skip it if it's a normal week.</p>
  <div class="opts">
    <button class="opt" data-set="weekend" data-val="none" aria-pressed="${S.weekend==='none'}">Weekdays only</button>
    <button class="opt" data-set="weekend" data-val="satam" aria-pressed="${S.weekend==='satam'}">Saturday morning<span class="tag">+${money(RULES.saturdayAM)}</span></button>
    <button class="opt" data-set="weekend" data-val="satfull" aria-pressed="${S.weekend==='satfull'}">Full Saturday<span class="tag">+${money(RULES.saturdayFull)}</span></button>
    <button class="opt" data-set="weekend" data-val="weekend" aria-pressed="${S.weekend==='weekend'}">
      <span>Full weekend — Sat &amp; Sun<small>Saturday priced now, Sunday confirmed separately</small></span>
      <span class="tag">+${money(RULES.saturdayAM)}</span></button>
    <button class="opt" data-set="weekend" data-val="sun" aria-pressed="${S.weekend==='sun'}">Sunday only<span class="tag">Ask</span></button>
  </div>
  ${sundayFlagged()?`<div class="note stop"><p><strong>Sunday needs checking.</strong> Councils prohibit noisy site work audible outside the boundary on Sundays. If your site has consent — or the work's internal — say so and I'll price it.</p></div>`:""}
  <label class="f"><span>Expected overtime, hours per day</span>
    <input id="ot" type="number" min="0" max="4" step="0.5" inputmode="decimal" placeholder="0" value="${S.otHours||""}">
    <p class="hint">Leave blank if you don't know. Overtime's always agreed before I stay, never after.</p></label>`,

/* 4 — tasks */ () => `
  <p class="eyebrow">Step 5 · The work</p>
  <h1>What would I be doing?</h1>
  <p class="help">Tick what applies. It doesn't change the price — it tells me what to bring and whether it's a fit.</p>
  ${TASKS.map((grp,gi)=>{
    const n = grp.items.filter((_,ii)=>S.tasks.has(gi+"-"+ii)).length;
    return `<details class="grp" ${n?"open":""}>
      <summary>${grp.g}${n?`<span class="count">${n}</span>`:""}</summary>
      <div class="items">
        ${grp.items.map((it,ii)=>`<label class="chk"><input type="checkbox" data-task="${gi}-${ii}" ${S.tasks.has(gi+"-"+ii)?"checked":""}><span>${it}</span></label>`).join("")}
        <button class="allbtn" data-all="${gi}">${n===grp.items.length?"Clear all":"Select all"}</button>
      </div></details>`; }).join("")}
  <label class="f" style="margin-top:1rem"><span>Anything else</span>
    <textarea id="notes" placeholder="e.g. two-storey refurb, third floor, no lift">${S.notes}</textarea></label>
  <div class="note"><p><strong>Always included:</strong> correct PPE — boots, glasses, dust mask. Safe manual handling. Hazards reported straight away.</p></div>`,

/* 5 — quote */ () => {
  const {lines,total,siteDays}=calc();
  const cis = total*RULES.cisRate, net = total-cis;
  const picked = [].concat(...TASKS.map((g,gi)=>g.items.filter((_,ii)=>S.tasks.has(gi+"-"+ii))));
  return `
  <p class="eyebrow">Your quote</p>
  <h1>${money(total)}</h1>
  <p class="help">Fixed on the details you gave. No hidden extras.</p>
  <dl class="lines">
    ${lines.map(l=>`<div class="line"><dt>${l.label}${l.sub?`<small>${l.sub}</small>`:""}</dt><dd>${money(l.amount)}</dd></div>`).join("")}
    <div class="line"><dt>Travel<small>${S.zone.label} · ${S.zone.miles} return miles × ${siteDays} day${siteDays>1?"s":""} = ${S.zone.miles*siteDays} miles</small></dt><dd>Included</dd></div>
    <div class="line sum"><dt>Invoice total</dt><dd>${money(total)}</dd></div>
  </dl>
  <h2>What you pay under CIS</h2>
  <dl class="lines">
    <div class="line sub"><dt>Labour invoiced</dt><dd>${money(total)}</dd></div>
    <div class="line sub"><dt>Less CIS deduction at 20%<small>You deduct this and pay it to HMRC on my behalf</small></dt><dd>−${money(cis)}</dd></div>
    <div class="line net"><dt>Paid to me</dt><dd>${money(net)}</dd></div>
  </dl>
  <div class="note"><p>I'm CIS registered and verified, so the standard 20% applies — not the 30% unverified rate. No materials in this quote, so the deduction is on the full amount.</p></div>
  ${sundayFlagged()?`<div class="note stop"><p><strong>Sunday isn't in this figure.</strong> Tell me whether the site has consent for Sunday working and I'll price it separately.</p></div>`:""}
  ${picked.length?`<h2>Work covered</h2><ul class="terms">${picked.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}
  <h2>Included</h2>
  <ul class="terms">
    <li>Travel to site — no mileage added on top</li>
    <li>My own tools, power tools and PPE</li>
    <li>${RULES.hours.weekday}</li>
    <li>Engaged as a labour-only subcontractor under your carpenter's direction</li>
  </ul>
  <h2>Not included</h2>
  <ul class="terms">
    <li>Consumables and materials — supplied by you, or collected and invoiced separately</li>
    <li>Overtime past 8 hours at ${money(otRate())}/hr, agreed in advance</li>
    <li>Solo carpentry and general labouring — I work alongside a carpenter, not instead of one</li>
  </ul>`;
},

/* 6 — send */ () => `
  <p class="eyebrow">Last step</p>
  <h1>Send this to Chris</h1>
  <p class="help">The quote's already worked out. This just tells me who to come back to.</p>
  <label class="f"><span>Company</span><input id="co" autocomplete="organization" placeholder="Brookfield Joinery" value="${S.company}"></label>
  <label class="f"><span>Your name</span><input id="nm" autocomplete="name" placeholder="Dave Wilson" value="${S.name}"></label>
  <label class="f"><span>Phone</span><input id="ph" type="tel" autocomplete="tel" inputmode="tel" placeholder="07700 900123" value="${S.phone}"></label>
  <label class="f"><span>Email (optional)</span><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="dave@brookfield.co.uk" value="${S.email}"></label>
  <p class="hint">I'm on site during the day, so I'll come back to you at breaks or in the evening.</p>`
];

const STOPS = {
  solo: () => `
    <p class="eyebrow">Not what I do</p>
    <h1>I work as a mate, and only as a mate</h1>
    <div class="note stop">
      <p><strong>Solo carpentry</strong> — setting out and carrying out the work unsupervised — sits outside what I'm ticketed and insured for, so I won't quote it.</p>
      <p><strong>General labouring</strong> I've stopped taking. The lifting is heavier and less predictable than mate work, and an injury puts me off the tools entirely.</p>
      <p>If there'll be a carpenter on site after all, go back and I'll price it. Otherwise message me and I'll point you at someone.</p>
    </div>
    <div class="nav"><button class="btn btn-ghost" data-act="back">Back</button>
    <a class="btn btn-primary" href="https://wa.me/${RULES.whatsapp}">Message Chris</a></div>`,
  outside: () => `
    <p class="eyebrow">Outside the usual patch</p>
    <h1>That one needs a conversation</h1>
    <div class="note stop">
      <p>That site's roughly <strong>${S.zone?S.zone.miles:"60+"} return miles</strong> — past my standard zones, so I won't auto-price it.</p>
      <p>It isn't a no. Longer bookings further out can work. Message me with the dates and I'll tell you straight away.</p>
    </div>
    <div class="nav"><button class="btn btn-ghost" data-act="back">Back</button>
    <a class="btn btn-primary" href="https://wa.me/${RULES.whatsapp}">Message Chris</a></div>`
};

function canAdvance(){
  if(step===0) return S.need==="mate";
  if(step===1) return !!(S.zone&&S.zone.key!=="outside");
  if(step===2) return S.days>0;
  if(step===6) return S.company.trim()&&S.name.trim()&&S.phone.trim();
  return true;
}

function render(){
  const a=app();
  if(step===0 && S.need==="solo"){ a.innerHTML=STOPS.solo(); wire(); paintTotal(); return; }
  if(step===1 && S.zone && S.zone.key==="outside"){ a.innerHTML=STOPS.outside(); wire(); paintTotal(); return; }
  const labels=["Continue","Continue","Continue","Continue","See my quote","Send it","Send to Chris"];
  a.innerHTML = SCREENS[step]() + nav(step>0, labels[step], !canAdvance());
  document.getElementById("stepCount").textContent =
    step<=4 ? `Step ${step+1} of 5` : (step===5?"Your quote":"Send it");
  document.getElementById("bar").style.width = Math.round((step+1)/7*100)+"%";
  if(step===1) postcodeFeedback();
  wire(); paintTotal();
}

function postcodeFeedback(){
  const out=document.getElementById("pcOut"); if(!out) return;
  if(!S.postcode.trim()){ out.innerHTML=""; return; }
  if(!S.zone){ out.innerHTML=`<div class="note stop"><p>I don't recognise that postcode. Check it, or message me and I'll sort it manually.</p></div>`; return; }
  if(S.zone.key==="outside"){ out.innerHTML=`<div class="note stop"><p><strong>~${S.zone.miles} return miles.</strong> Outside my standard zones — continue and I'll explain.</p></div>`; return; }
  out.innerHTML=`<div class="note"><p><strong>${S.zone.label}</strong> — about ${S.zone.miles} return miles per day. Day rate ${money(RULES.dayRate[S.zone.key])}, travel included.</p></div>`;
}

function wire(){
  const a=app();
  a.querySelectorAll("[data-set]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.set; let v=b.dataset.val; if(k==="days") v=+v; S[k]=v; render(); }));
  a.querySelectorAll("[data-task]").forEach(c=>c.addEventListener("change",e=>{
    const id=e.target.dataset.task; e.target.checked?S.tasks.add(id):S.tasks.delete(id);
    const sum=e.target.closest("details").querySelector("summary");
    const gi=id.split("-")[0], n=TASKS[gi].items.filter((_,ii)=>S.tasks.has(gi+"-"+ii)).length;
    sum.innerHTML = TASKS[gi].g + (n?`<span class="count">${n}</span>`:"");
    const ab=e.target.closest(".items").querySelector(".allbtn");
    ab.textContent = n===TASKS[gi].items.length?"Clear all":"Select all";
    paintTotal(); }));
  a.querySelectorAll("[data-all]").forEach(b=>b.addEventListener("click",()=>{
    const gi=b.dataset.all, all=TASKS[gi].items.every((_,ii)=>S.tasks.has(gi+"-"+ii));
    TASKS[gi].items.forEach((_,ii)=> all?S.tasks.delete(gi+"-"+ii):S.tasks.add(gi+"-"+ii));
    const open=[...a.querySelectorAll("details")].map(d=>d.open); render();
    [...app().querySelectorAll("details")].forEach((d,i)=>d.open=open[i]||d.open); }));

  const on=(id,fn,ev)=>{const e=document.getElementById(id); if(e) e.addEventListener(ev||"input",fn);};
  on("pc",e=>{ S.postcode=e.target.value; S.zone=zoneFor(S.postcode); postcodeFeedback();
    const n=a.querySelector('[data-act="next"]'); if(n) n.disabled=!canAdvance(); paintTotal(); });
  on("daysN",e=>{ const v=parseInt(e.target.value,10); S.days=(v>0&&v<=60)?v:null;
    const n=a.querySelector('[data-act="next"]'); if(n) n.disabled=!canAdvance(); paintTotal(); });
  on("start",e=>S.start=e.target.value);
  on("ot",e=>{ const v=parseFloat(e.target.value); S.otHours=(v>0&&v<=4)?v:0; paintTotal(); });
  on("notes",e=>S.notes=e.target.value);
  ["co","nm","ph","em"].forEach((id,i)=>on(id,e=>{ S[["company","name","phone","email"][i]]=e.target.value;
    const n=a.querySelector('[data-act="next"]'); if(n) n.disabled=!canAdvance(); }));

  const back=a.querySelector('[data-act="back"]');
  if(back) back.addEventListener("click",()=>{
    if(step===0){ S.need=null; render(); return; }
    if(step===1&&S.zone&&S.zone.key==="outside"){ S.postcode=""; S.zone=null; render(); return; }
    step--; render(); });
  const next=a.querySelector('[data-act="next"]');
  if(next) next.addEventListener("click",()=>{
    if(step===6){ send(); return; } step++; render(); window.scrollTo({top:0,behavior:"smooth"}); });
}

function send(){
  const {lines,total,siteDays}=calc();
  const cis=total*RULES.cisRate, net=total-cis;
  const miles=S.zone.miles*siteDays, claim=miles*RULES.mileageRate;
  const picked=[].concat(...TASKS.map((g,gi)=>g.items.filter((_,ii)=>S.tasks.has(gi+"-"+ii))));
  const msg=[
    "CDCS QUOTE REQUEST","",
    "Company: "+S.company, "Name: "+S.name, "Phone: "+S.phone,
    S.email?"Email: "+S.email:"", "",
    "Role: Mate for their carpenter",
    "Site: "+S.postcode.toUpperCase()+" ("+S.zone.label+")",
    "Start: "+(S.start||"not given"),
    "Days: "+S.days+(S.otHours?"  |  OT "+S.otHours+" hr/day":""),
    S.weekend!=="none"?"Weekend: "+({satam:"Sat morning",satfull:"Full Sat",sun:"Sunday only — needs consent",weekend:"Sat + Sun — Sun needs consent"})[S.weekend]:"",
    S.notes?"Notes: "+S.notes:"","",
    "QUOTED:", ...lines.map(l=>"  "+l.label+" — "+money(l.amount)),
    "  INVOICE TOTAL "+money(total),
    "  CIS 20% −"+money(cis)+"  ->  PAID "+money(net), "",
    "MY RECORDS:",
    "  Business mileage: "+miles+" mi ("+S.zone.miles+" return x "+siteDays+" days)",
    "  Mileage claim at "+(RULES.mileageRate*100)+"p: "+money(claim),
    picked.length?"":"",
    picked.length?"TASKS TICKED:":"", ...picked.map(p=>"  - "+p)
  ].filter(Boolean).join("\n");
  window.open("https://wa.me/"+RULES.whatsapp+"?text="+encodeURIComponent(msg),"_blank","noopener");
}

render();
</script>
</body></html>
